name: Test and publish container

on:
    pull_request:
    push:
        branches:
            - main
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install uv and Python
              uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  version: 0.12.22
                  python-version: "3.14"
                  enable-cache: true
                  cache-dependency-glob: uv.lock
            - name: Install project
              run: uv sync --frozen --all-groups
            - name: Run tests
              run: uv run pytest
            - name: Lint
              run: uv run ruff check src tests

    container:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    publish:
        if: github.event_name == 'push'
        needs:
            - test
            - container
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
            - name: Prepare image name
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
              run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - name: Generate image tags and labels
              id: metadata
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=sha,format=long
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
