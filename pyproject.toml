[project]
name = "fastprize"
version = "0.1.0"
description = "Manage conference events and run live prize draws"
readme = "README.md"
authors = [
    { name = "Mark Parsons", email = "mark@mhjp.ca" },
]
requires-python = ">=3.14"
dependencies = [
    "apsw>=3.54.1.0",
    "argon2-cffi>=23.1.0",
    "fastlite>=0.2.4",
    "monsterui>=1.0.47",
    "python-fasthtml>=0.14.13",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
fastprize = "fastprize:main"
fastprize-admin = "fastprize.auth_cli:main"

[build-system]
requires = [
    "uv_build>=0.12.10,<0.13.0",
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
