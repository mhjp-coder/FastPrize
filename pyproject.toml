[project]
name = "fastprize"
version = "0.1.0"
description = "Manage conference events and run live prize draws"
readme = "README.md"
authors = [
    { name = "Mark Parsons", email = "mark@mhjp.ca" },
]
requires-python = ">=3.14"
dependencies = [
    "python-fasthtml>=0.14.13",
    "segno>=1.6.6",
]

[project.scripts]
fastprize = "fastprize:main"

[build-system]
requires = [
    "uv_build>=0.12.10,<0.13.0",
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
